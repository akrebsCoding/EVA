# Testsuite des EVA-Managers.
#
# Testlayer ↔ Marker:
#   L0 Unit        → unit         rein, kein Netz, kein Gerät
#   L1 Component   → component    eine Komponente, Mock/Stub
#   L2 Integration → integration  Fake-Dot/Fake-Wyoming, uvicorn-Subprozess
#   L4 Wake-Smoke  → wake         Modell lädt, Score relativ
#   L5 Live-HIL    → live         gegen ein echtes Deployment, default geskippt
#   (Dauer)        → slow         Modell-Laden/Inferenz, ≈ min
#
# Ohne Argumente läuft pytest nur über `tests/`; `app/` bleibt außen vor.
# Der L2-Manager läuft als uvicorn-Subprozess mit `.env.test`
# (`tests/conftest.py::manager_proc`).
[pytest]
minversion = 8.0
testpaths = tests

# `app.*` ist nur importierbar, wenn die Projektwurzel in `sys.path` liegt.
pythonpath = .

addopts = -ra -q --strict-markers

# Ein `xfail`, der grün wird, ist eine Behauptung, die nicht mehr stimmt
# ⇒ als **Fehler** melden, nicht als Erfolg.
xfail_strict = true

log_cli = false
log_level = INFO

# ── JUnit-XML ────────────────────────────────────────────────────────────
# Der Pfad mit Zeitstempel steht in `tests/conftest.py` (`pytest_configure`),
# da pytest für den JUnit-Pfad keinen ini-Schalter kennt und im Pfad kein
# `strftime` expandiert. `reports/` ist git-ignoriert — der Report bleibt lokal.
junit_family = xunit2
junit_suite_name = eva-manager
junit_logging = all
junit_log_passing_tests = false

# ── Marker (exakt diese sechs, keine erfundenen) ─────────────────────────
markers =
    unit: L0 – reine Logik, kein Netz, kein Gerät, kein Modell
    component: L1 – eine Komponente mit Mock/Stub (ha_client, llm_client, stt/tts_client)
    integration: L2 – Fake-Echo-Dot/Fake-Wyoming gegen den laufenden Manager
    wake: L4 – Wake-Word-Smoke: Modell lädt, Score relativ zur Schwelle
    live: L5 – Live-HIL gegen ein echtes Deployment; per Voreinstellung skipped
    slow: Dauer in Sekunden bis Minuten (Modell-Laden, Inferenz-Benchmark)
